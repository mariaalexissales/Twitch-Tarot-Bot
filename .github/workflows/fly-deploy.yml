# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
      - master
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # A deploy updates a stopped Machine without starting it, so a bot that hit
      # its restart cap would stay down. Standbys are skipped: they must stay stopped.
      - name: Start stopped Machines
        shell: bash
        run: |
          flyctl machine list --json \
            | jq -r '.[] | select(.state == "stopped" and ((.config.standbys // []) | length == 0)) | .id' \
            | xargs -r -n1 flyctl machine start
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
