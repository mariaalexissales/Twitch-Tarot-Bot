# fly.toml app configuration file generated for twitch-tarot-bot on 2026-10-11T14:44:13-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'twitch-tarot-bot'
primary_region = 'ord'

[build]
[env]
  ENV = 'production'

# No [http_service]: the bot only dials out to Twitch chat. With one, Fly sees
# no traffic and stops the Machine.

[[restart]]
  policy = 'on-failure'
  retries = 5

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
